#cloud-config
users:
  - name: ubuntu
    groups: sudo
    shell: /bin/bash
    lock_passwd: true
    sudo: ["ALL=(ALL) NOPASSWD:ALL"]
    ssh_authorized_keys:
      - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEBYgTgMeFqASidm6Asr7kuS8vg0Ztr+g337XQikhQXh ayrat@ayrat-ubuntu
runcmd:
  - wget https://storage.yandexcloud.net/${bucket_name}/image.jpeg -O /var/www/html/image.jpeg
  - |
    PUBLIC_IPV4=$(curl -s ifconfig.me)
    echo "<html><head><title>My Picture</title></head><body><h1>Hostname is: $(hostname)</h1>i<img src='image.jpeg'></body></html>" > /var/www/html/index.html
    systemctl enable apache2
    systemctl restart apache2